<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground do Kitten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="/demo/style.css" />
    <link rel="stylesheet" href="/demo/playground.css" />
  </head>
  <body>
    <header class="top">
      <h1 class="brand">Playground</h1>
      <p class="lede">
        Monte o cenário: arraste os elementos, puxe o canto da caixa para redimensionar e veja os gatos se
        adaptarem. Duplo clique remove um elemento. <a class="link" href="/">Voltar para a demo</a>
      </p>
    </header>

    <main class="pg">
      <section class="sandbox" id="sandbox" aria-label="Caixa de areia">
        <div class="surfaces" id="surfaces" data-kitten-ignore aria-hidden="true"></div>
      </section>

      <aside class="panel" aria-label="Controles do playground">
        <section class="group">
          <h2>Novo gato</h2>
          <div class="fields">
            <label>Pelagem <select id="coat"></select></label>
            <label>Pixel
              <select id="scale">
                <option value="2">2×</option>
                <option value="3" selected>3×</option>
                <option value="4">4×</option>
                <option value="5">5×</option>
              </select>
            </label>
            <label>Velocidade <span class="range"><input id="speed" type="range" min="0.5" max="2.5" step="0.25" value="1" /><output id="speed-out">1×</output></span></label>
            <label>Semente <input id="seed" type="number" inputmode="numeric" placeholder="aleatória" /></label>
          </div>
          <div class="row">
            <button class="btn primary" type="button" id="add">Adicionar gato</button>
            <button class="btn" type="button" id="clear-cats">Remover todos</button>
          </div>
        </section>

        <section class="group">
          <h2>Ações para todos</h2>
          <div class="actions">
            <button class="btn" type="button" data-action="sit">Sentar</button>
            <button class="btn" type="button" data-action="walk">Passear</button>
            <button class="btn" type="button" data-action="jump">Pular</button>
            <button class="btn" type="button" data-action="climb">Escalar</button>
            <button class="btn" type="button" data-action="sleep">Dormir</button>
            <button class="btn" type="button" data-action="groom">Se limpar</button>
            <button class="btn" type="button" data-action="play">Brincar</button>
            <button class="btn" type="button" data-action="bat">Dar patada</button>
            <button class="btn" type="button" data-action="meow">Miar</button>
          </div>
        </section>

        <section class="group">
          <h2>Elementos</h2>
          <div class="row">
            <button class="btn" type="button" data-piece="box">+ Caixa</button>
            <button class="btn" type="button" data-piece="button">+ Botão</button>
            <button class="btn" type="button" data-piece="shelf">+ Prateleira</button>
            <button class="btn" type="button" data-piece="toy">+ Brinquedo</button>
          </div>
          <div class="row">
            <button class="btn" type="button" id="clear-pieces">Limpar elementos</button>
            <button class="btn" type="button" id="reset">Cenário inicial</button>
          </div>
        </section>

        <section class="group">
          <h2>Opções</h2>
          <label class="check"><input type="checkbox" id="debug" checked /> Mostrar superfícies detectadas</label>
          <label class="check"><input type="checkbox" id="interactive" checked /> Clique, carinho e arrastar</label>
          <label class="check"><input type="checkbox" id="nudge" checked /> Empurrar elementos na patada</label>
          <label class="check"><input type="checkbox" id="summon" checked /> Dois cliques chamam os gatos</label>
          <label>Onde pode pisar
            <select id="platforms">
              <option value="auto">auto: tudo com caixa visível</option>
              <option value=".box, .shelf">só caixas e prateleiras</option>
              <option value="[data-kitten-platform]">só [data-kitten-platform]</option>
            </select>
          </label>
          <p class="hint">Mudar as opções recria os gatos que já estão na caixa.</p>
        </section>

        <section class="group">
          <h2>Na caixa</h2>
          <ul class="roster" id="roster"></ul>
        </section>
      </aside>
    </main>

    <script type="module" src="/demo/playground.ts"></script>
  </body>
</html>
